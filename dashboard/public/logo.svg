<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pulse Animation -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>

  <!-- Main Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGradient)" stroke-width="16" stroke-opacity="0.1" stroke="white" />

  <!-- Status Dots -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="4,8" />
    
    <!-- Activity Dots -->
    <g transform="rotate(-30)">
      <circle cx="180" cy="0" r="12" fill="#10B981" filter="url(#glow)" opacity="0.9" />
    </g>
    <g transform="rotate(90)">
      <circle cx="180" cy="0" r="12" fill="#3B82F6" filter="url(#glow)" opacity="0.9" />
    </g>
    <g transform="rotate(210)">
      <circle cx="180" cy="0" r="12" fill="#8B5CF6" filter="url(#glow)" opacity="0.9" />
    </g>
  </g>

  <!-- Code Activity Lines (Stylized "v" shape) -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- Left Line -->
    <path 
      d="M-100,-50 L-20,100" 
      stroke="white" 
      stroke-width="24" 
      stroke-linecap="round"
    />
    <!-- Right Line -->
    <path 
      d="M100,-50 L20,100" 
      stroke="white" 
      stroke-width="24" 
      stroke-linecap="round"
    />
  </g>

  <!-- Central Dot -->
  <circle cx="256" cy="256" r="16" fill="white" opacity="0.95" />
</svg> 